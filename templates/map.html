<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>歴史音声ガイド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ═══════════════════════════════════════
   ドット絵・ピクセルアートスタイル
   ═══════════════════════════════════════ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: 'DotGothic16', 'Hiragino Sans', monospace;
  background: #000050;
  color: #FFFFFF;
  overflow: hidden;
}

/* ── マップタイルをドット絵化 ── */
.leaflet-tile {
  image-rendering: pixelated !important;
  image-rendering: crisp-edges !important;
}
.leaflet-tile-pane {
  filter: saturate(195%) contrast(108%) brightness(90%) hue-rotate(-8deg);
}
/* ドット感を強調するグリッドオーバーレイ */
#map::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,0,30,0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,30,0.07) 1px, transparent 1px);
  background-size: 4px 4px;
  pointer-events: none;
  z-index: 400;
}

/* ── ヘッダー（DQウィンドウ風） ── */
#header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: #000060;
  padding: 8px 10px 7px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 4px solid #FFFFFF;
  box-shadow: 0 4px 0 #000030, inset 0 -1px 0 #8888FF;
}
#header h1 {
  font-size: 14px; font-weight: 400;
  color: #FFD700;
  text-shadow: 2px 2px 0 #000000, -1px -1px 0 #AA6600;
  letter-spacing: .06em;
}
#header p { font-size: 9px; color: #8888CC; margin-top: 2px; letter-spacing: .04em; }

/* DQ風ボタン共通 */
.dq-btn {
  display: inline-block;
  background: #000070;
  border: 2px solid #FFFFFF;
  box-shadow: 2px 2px 0 #000000, inset 1px 1px 0 #6666AA;
  padding: 4px 10px;
  font-size: 11px; font-weight: 400;
  color: #FFD700;
  text-decoration: none; white-space: nowrap; cursor: pointer;
  font-family: 'DotGothic16', monospace;
  letter-spacing: .04em;
  transition: none;
  -webkit-tap-highlight-color: transparent;
}
.dq-btn:active { transform: translate(2px,2px); box-shadow: none; }

.gps-badge {
  display: flex; align-items: center; gap: 5px;
  background: #000070;
  border: 2px solid #FFFFFF;
  box-shadow: 2px 2px 0 #000000;
  padding: 4px 8px; font-size: 10px; cursor: pointer;
  font-family: 'DotGothic16', monospace; color: #FFFFFF;
  -webkit-tap-highlight-color: transparent;
}
.gps-dot { width: 6px; height: 6px; flex-shrink: 0; background: #555555; }
.gps-dot.active { background: #00FF00; animation: pixblink 1.2s steps(1) infinite; }
.gps-dot.error  { background: #FF2222; }
@keyframes pixblink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ── エリアフィルターバー ── */
#area-bar {
  position: fixed; top: 55px; left: 0; right: 0; z-index: 999;
  background: #000050;
  padding: 5px 8px;
  display: flex; gap: 5px; overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 3px solid #FFFFFF;
  box-shadow: 0 3px 0 #000030;
}
#area-bar::-webkit-scrollbar { display: none; }
.area-btn {
  flex-shrink: 0;
  padding: 4px 10px;
  border: 2px solid rgba(255,255,255,0.4);
  background: rgba(0,0,80,0.9);
  color: rgba(255,255,255,0.65);
  font-size: 10px; font-weight: 400;
  cursor: pointer; white-space: nowrap;
  font-family: 'DotGothic16', monospace;
  box-shadow: 1px 1px 0 #000000;
  -webkit-tap-highlight-color: transparent;
}
.area-btn.active { color: #000030; border-color: transparent; box-shadow: 1px 1px 0 #000000; }

/* ── 種別フィルターバー ── */
#type-bar {
  position: fixed; top: 93px; left: 0; right: 0; z-index: 998;
  background: #00003a;
  padding: 4px 8px;
  display: flex; gap: 4px; overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 2px solid rgba(255,255,255,0.2);
}
#type-bar::-webkit-scrollbar { display: none; }
.type-btn {
  flex-shrink: 0;
  padding: 3px 9px;
  border: 1px solid rgba(255,255,255,0.3);
  background: rgba(0,0,60,0.8);
  color: rgba(255,255,255,0.55);
  font-size: 10px; cursor: pointer; white-space: nowrap;
  font-family: 'DotGothic16', monospace;
  -webkit-tap-highlight-color: transparent;
}
.type-btn.active { color: #000030; border-color: transparent; }

/* ── ドリルダウンバー共通 ── */
.drill-bar {
  display: none;
  position: fixed; left: 0; right: 0; z-index: 996;
  background: #00002a;
  padding: 4px 8px; gap: 4px; overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 2px solid rgba(255,255,255,0.1);
}
.drill-bar.show { display: flex; }
.drill-bar::-webkit-scrollbar { display: none; }
.drill-btn {
  flex-shrink: 0; padding: 3px 10px;
  border: 1px solid rgba(255,255,255,0.3);
  background: rgba(0,0,55,0.85);
  color: rgba(255,255,255,0.6);
  font-size: 10px; cursor: pointer; white-space: nowrap;
  font-family: 'DotGothic16', monospace;
  -webkit-tap-highlight-color: transparent;
}
.drill-btn:active { transform:translate(1px,1px); }
.drill-btn.active { color: #000030; border-color: transparent; }
.drill-btn.back { color: #FFD700; border-color: rgba(255,215,0,0.4); margin-right: 4px; }

/* ── 地図 ── */
:root { --map-top: 133px; }
#map {
  position: fixed;
  top: var(--map-top); bottom: 52px; left: 0; right: 0;
  z-index: 1;
}

/* ── タブバー ── */
#tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
  background: #000060;
  border-top: 4px solid #FFFFFF;
  box-shadow: 0 -2px 0 #000030;
  display: flex; height: 52px;
}
.tab-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 2px; cursor: pointer;
  font-size: 10px; color: rgba(255,255,255,0.4);
  border: none; background: none;
  font-family: 'DotGothic16', monospace;
  border-right: 2px solid rgba(255,255,255,0.15);
  -webkit-tap-highlight-color: transparent;
}
.tab-btn:last-child { border-right: none; }
.tab-btn .tab-icon { font-size: 18px; }
.tab-btn.active { color: #FFD700; background: rgba(255,215,0,0.08); }

/* ── リストビュー ── */
#list-view {
  display: none;
  position: fixed;
  top: var(--map-top); bottom: 52px; left: 0; right: 0;
  z-index: 2; overflow-y: auto;
  background: #000040;
  padding: 10px;
  -webkit-overflow-scrolling: touch;
}
#list-view.show { display: block; }

/* ── 検索ビュー ── */
#search-view {
  display: none;
  position: fixed;
  top: var(--map-top); bottom: 52px; left: 0; right: 0;
  z-index: 2; flex-direction: column;
  background: #000040;
}
#search-view.show { display: flex; }
#search-input-wrap {
  padding: 8px 10px;
  background: #000060;
  border-bottom: 2px solid rgba(255,255,255,0.2);
  flex-shrink: 0;
}
#search-input {
  width: 100%; padding: 8px 12px;
  background: #000020; border: 2px solid #FFD700;
  color: #FFD700; font-family: 'DotGothic16', monospace;
  font-size: 14px; outline: none; letter-spacing: .04em;
  box-shadow: inset 2px 2px 0 #000000;
}
#search-input::placeholder { color: rgba(255,215,0,0.3); }
#search-results {
  flex: 1; overflow-y: auto; padding: 8px;
  -webkit-overflow-scrolling: touch;
}
#search-hint {
  text-align: center; padding: 40px 20px;
  color: rgba(255,255,255,0.3); font-size: 12px; line-height: 2;
}

/* ── 訪問進捗バッジ ── */
#progress-badge {
  font-size: 9px; color: #88FF88; margin-top: 2px;
  letter-spacing: .04em;
}

.list-area-header {
  font-size: 12px; font-weight: 400;
  padding: 6px 4px 5px;
  border-bottom: 2px solid currentColor;
  margin-bottom: 7px; margin-top: 14px;
  letter-spacing: .06em;
  font-family: 'DotGothic16', monospace;
  text-shadow: 1px 1px 0 #000000;
}

.spot-card {
  background: #000060;
  border: 2px solid rgba(255,255,255,0.45);
  box-shadow: 2px 2px 0 #000000;
  padding: 10px 12px;
  text-decoration: none; color: white;
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 7px;
  -webkit-tap-highlight-color: transparent;
  font-family: 'DotGothic16', monospace;
}
.spot-card:active { transform: translate(2px,2px); box-shadow: none; background: #000080; }
.spot-icon-box {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
  border: 2px solid rgba(255,255,255,0.25);
}
.spot-info { flex: 1; min-width: 0; }
.spot-name { font-size: 12px; font-weight: 400; }
.spot-kana { font-size: 9px; color: rgba(255,255,255,0.4); margin-top: 1px; }
.spot-era  { font-size: 10px; color: #88CCFF; margin-top: 2px; }
.arrow { font-size: 14px; color: #FFD700; flex-shrink: 0; }

/* ── Leafletポップアップ（DQダイアログ風） ── */
.leaflet-popup-content-wrapper {
  background: #000060 !important;
  color: white !important;
  border-radius: 0 !important;
  border: 3px solid #FFFFFF !important;
  box-shadow: 3px 3px 0 #000000, 0 0 0 1px #FFFFFF,
              inset 1px 1px 0 #8888CC !important;
}
.leaflet-popup-tip-container { display: none !important; }
.leaflet-popup-content {
  margin: 12px 14px !important;
  font-family: 'DotGothic16', monospace !important;
}
.popup-name {
  font-size: 14px; font-weight: 400;
  margin-bottom: 4px; color: #FFD700;
  text-shadow: 1px 1px 0 #000000;
  letter-spacing: .04em;
}
.popup-era  { font-size: 10px; color: #88CCFF; margin-bottom: 5px; }
.popup-highlight {
  font-size: 11px; color: rgba(255,255,255,0.85);
  line-height: 1.65; margin-bottom: 10px;
}
.popup-btn {
  display: block; text-align: center;
  background: #FFD700; color: #000040;
  border: 2px solid #FFFFFF;
  box-shadow: 2px 2px 0 #000000;
  padding: 6px 12px;
  text-decoration: none; font-size: 12px; font-weight: 400;
  font-family: 'DotGothic16', monospace;
  letter-spacing: .04em;
  -webkit-tap-highlight-color: transparent;
}
.popup-btn:active { transform: translate(2px,2px); box-shadow: none; }

/* ── ピクセルアートマーカー ── */
.pix-marker {
  display: flex; align-items: center; justify-content: center;
  border: 2px solid rgba(255,255,255,0.9);
  box-shadow: 2px 2px 0 rgba(0,0,0,0.9);
  font-size: 11px; line-height: 1;
  image-rendering: pixelated;
}

/* ── ズームコントロール ── */
.leaflet-control-zoom a {
  background: #000060 !important;
  color: #FFD700 !important;
  border: 2px solid #FFFFFF !important;
  border-radius: 0 !important;
  font-family: 'DotGothic16', monospace !important;
  box-shadow: 2px 2px 0 #000000 !important;
  width: 28px !important; height: 28px !important;
  line-height: 24px !important;
}
.leaflet-control-zoom a:hover { background: #000080 !important; }
.leaflet-control-zoom { border: none !important; box-shadow: none !important; }

/* ── GPS現在地マーカー ── */
.player-icon {
  font-size: 22px;
  animation: playerbob 0.8s steps(2) infinite;
  filter: drop-shadow(2px 2px 0 #000000);
}
@keyframes playerbob { 0%{transform:translateY(0)} 50%{transform:translateY(-2px)} 100%{transform:translateY(0)} }

/* ══════════════════════════════════
   オープニング画面
   ══════════════════════════════════ */
#opening {
  position: fixed; inset: 0; z-index: 99999;
  background: #000010;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-family: 'DotGothic16', monospace;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#opening.flash { background: #FFFFFF; transition: background 0.05s; }
#opening.fadeout { opacity: 0; transition: opacity 0.6s ease; pointer-events: none; }

/* ピクセルグリッド背景 */
#opening::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(0,0,80,0.25) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,80,0.25) 1px, transparent 1px);
  background-size: 8px 8px;
  pointer-events: none;
}

/* 星 */
.op-star {
  position: absolute; background: white;
  width: 2px; height: 2px;
  animation: op-twinkle var(--t,2s) steps(2) infinite var(--d,0s);
}
@keyframes op-twinkle { 0%,100%{opacity:1} 50%{opacity:0.1} }

/* ロゴ城 */
#op-logo {
  font-size: 56px; line-height: 1;
  filter: drop-shadow(0 0 8px #FFD700) drop-shadow(2px 2px 0 #000);
  opacity: 0;
  animation: op-drop 0.6s cubic-bezier(.2,1.4,.5,1) forwards 0.4s;
}
@keyframes op-drop {
  from { opacity:0; transform: translateY(-30px) scale(0.6); }
  to   { opacity:1; transform: translateY(0)    scale(1); }
}

/* タイトル */
#op-title {
  font-size: 30px;
  color: #FFD700;
  text-shadow: 3px 3px 0 #000000, -1px -1px 0 #996600;
  letter-spacing: 0.12em;
  margin-top: 14px;
  opacity: 0;
  animation: op-rise 0.7s ease forwards 1.1s;
}
/* サブタイトル */
#op-subtitle {
  font-size: 13px; color: rgba(255,255,255,0.55);
  letter-spacing: 0.08em; margin-top: 6px;
  opacity: 0;
  animation: op-rise 0.5s ease forwards 1.7s;
}
/* セパレーター */
#op-sep {
  margin: 28px 0 0;
  color: rgba(255,215,0,0.35);
  font-size: 13px; letter-spacing: 0.3em;
  opacity: 0;
  animation: op-rise 0.4s ease forwards 2.2s;
}
/* ぼうけんボタン */
#op-btn {
  margin-top: 22px;
  font-size: 17px; color: #FFFFFF;
  letter-spacing: 0.1em;
  text-shadow: 2px 2px 0 #000;
  opacity: 0;
  animation: op-rise 0.3s ease forwards 2.6s, op-blink 1.1s steps(1) infinite 3s;
}
@keyframes op-rise {
  from { opacity:0; transform: translateY(10px); }
  to   { opacity:1; transform: translateY(0); }
}
@keyframes op-blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ヒント */
#op-hint {
  position: absolute; bottom: 28px;
  font-size: 10px; color: rgba(255,255,255,0.2);
  letter-spacing: 0.05em;
}

/* スキャンライン（ブラウン管テレビ風） ── */
#scanlines {
  position: fixed; inset: 0;
  z-index: 500; pointer-events: none;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 3px,
    rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 4px
  );
}
/* ── コーナーフレーム装飾 ── */
#corner-tl, #corner-tr, #corner-bl, #corner-br {
  position: fixed; z-index: 501; pointer-events: none;
  width: 12px; height: 12px;
  border-color: rgba(255,255,255,0.2);
  border-style: solid;
}
#corner-tl { top: var(--map-top); left: 0; border-width: 2px 0 0 2px; }
#corner-tr { top: var(--map-top); right: 0; border-width: 2px 2px 0 0; }
#corner-bl { bottom: 52px; left: 0; border-width: 0 0 2px 2px; }
#corner-br { bottom: 52px; right: 0; border-width: 0 2px 2px 0; }
</style>
</head>
<body>

<!-- オープニング画面 -->
<div id="opening">
  <div id="op-logo">🏯</div>
  <div id="op-title">HISTORY QUEST</div>
  <div id="op-subtitle">～ 歴史音声ガイド ～</div>
  <div id="op-sep">◆ ◆ ◆ ◆ ◆</div>
  <div id="op-btn">▼ ぼうけんをはじめる ▼</div>
  <div id="op-hint">画面をタップして音楽を開始</div>
</div>

<div id="scanlines"></div>
<div id="corner-tl"></div>
<div id="corner-tr"></div>
<div id="corner-bl"></div>
<div id="corner-br"></div>

<!-- ヘッダー -->
<div id="header">
  <div>
    <h1>⚔ 歴史音声ガイド</h1>
    <p id="progress-badge">▶ 史跡をタップして音声解説</p>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <a href="/figures" class="dq-btn">⚔ 人物</a>
    <button class="dq-btn" id="bgm-btn" onclick="toggleBGM()" style="font-size:12px">🎵 BGM</button>
    <button class="dq-btn" id="bgm-track-btn" onclick="cycleBGMTrack()" style="font-size:12px" title="曲を切替">🏘️ 街</button>
    <div class="dq-btn" onclick="zoomToMe()" style="font-size:12px">📍 現在地</div>
    <div class="gps-badge" onclick="retryGPS()">
      <div class="gps-dot" id="gpsDot"></div>
      <span id="gpsLabel">GPS</span>
    </div>
  </div>
</div>

<!-- エリアフィルター -->
<div id="area-bar">
  <button class="area-btn active" data-area="all"        onclick="filterArea('all')">🗾 全て</button>
  <button class="area-btn" data-area="kumamoto"          onclick="filterArea('kumamoto')"   style="--ac:#2196F3">🏯 熊本市</button>
  <button class="area-btn" data-area="tabaruzaka"        onclick="filterArea('tabaruzaka')" style="--ac:#F44336">⚔️ 北部</button>
  <button class="area-btn" data-area="kikuchi"           onclick="filterArea('kikuchi')"    style="--ac:#9C27B0">⚜️ 菊池</button>
  <button class="area-btn" data-area="tamana"            onclick="filterArea('tamana')"     style="--ac:#FF9800">🌊 玉名</button>
  <button class="area-btn" data-area="yatsushiro"        onclick="filterArea('yatsushiro')" style="--ac:#009688">⛪ 八代</button>
  <button class="area-btn" data-area="aso"               onclick="filterArea('aso')"        style="--ac:#4CAF50">🌋 阿蘇</button>
  <button class="area-btn" data-area="hitoyoshi"         onclick="filterArea('hitoyoshi')"  style="--ac:#795548">🏔️ 人吉</button>
  <button class="area-btn" data-area="kamimashiki"       onclick="filterArea('kamimashiki')"style="--ac:#FF5722">🌉 上益城</button>
  <button class="area-btn" data-area="oguni"             onclick="filterArea('oguni')"      style="--ac:#00BCD4">🌲 小国</button>
  <button class="area-btn" data-area="oita"              onclick="filterArea('oita')"       style="--ac:#E91E63">🏮 大分</button>
  <button class="area-btn" data-area="nagasaki"          onclick="filterArea('nagasaki')"   style="--ac:#FF6B6B">⛪ 長崎</button>
  <button class="area-btn" data-area="fukuoka"           onclick="filterArea('fukuoka')"    style="--ac:#FF9800">🏮 福岡</button>
  <button class="area-btn" data-area="kagoshima"         onclick="filterArea('kagoshima')"  style="--ac:#8BC34A">🌋 鹿児島</button>
  <button class="area-btn" data-area="miyazaki"          onclick="filterArea('miyazaki')"   style="--ac:#4CAF50">🌄 宮崎</button>
  <button class="area-btn" data-area="saga"              onclick="filterArea('saga')"       style="--ac:#9C27B0">🏺 佐賀</button>
  <button class="area-btn" data-area="kanto"             onclick="filterArea('kanto')"      style="--ac:#3F51B5">🗼 関東</button>
  <button class="area-btn" data-area="kinki"             onclick="filterArea('kinki')"      style="--ac:#E040FB">🏯 近畿</button>
  <button class="area-btn" data-area="chubu"             onclick="filterArea('chubu')"      style="--ac:#00BCD4">🗻 中部</button>
  <button class="area-btn" data-area="tohoku"            onclick="filterArea('tohoku')"     style="--ac:#76FF03">❄️ 東北</button>
  <button class="area-btn" data-area="hokkaido"          onclick="filterArea('hokkaido')"   style="--ac:#00E5FF">🐻 北海道</button>
  <button class="area-btn" data-area="chugoku"           onclick="filterArea('chugoku')"    style="--ac:#FFEA00">🦌 中国</button>
  <button class="area-btn" data-area="shikoku"           onclick="filterArea('shikoku')"    style="--ac:#FF6D00">🍊 四国</button>
  <button class="area-btn" data-area="okinawa"           onclick="filterArea('okinawa')"    style="--ac:#FF4081">🌺 沖縄</button>
</div>

<!-- 種別フィルター -->
<div id="type-bar">
  <button class="type-btn active" data-type="all" onclick="filterType('all',this)">🗾 全種別</button>

/* ── オープニング ── */
(function() {
  const op = document.getElementById('opening');

  // ランダム星を生成
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'op-star';
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;
      --t:${1.5+Math.random()*3}s;--d:${Math.random()*3}s;
      opacity:${0.3+Math.random()*0.7};`;
    op.appendChild(s);
  }

  // ステージ管理：0=無音, 1=音楽中
  let stage = 0;
  const hint = document.getElementById('op-hint');

  function startMusic() {
    if (stage > 0) return;
    stage = 1;
    BGM.title();
    hint.textContent = '▼ ぼうけんをはじめる を押してください';
  }

  function doAdventure() {
    op.classList.add('flash');
    setTimeout(() => { op.classList.remove('flash'); op.classList.add('fadeout'); }, 120);
    setTimeout(() => { op.style.display = 'none'; BGM.field(); }, 750);
  }

  // 画面どこでも最初のタップ→音楽開始
  op.addEventListener('click', function(e) {
    if (stage === 0) { startMusic(); return; }
    // 音楽中にボタンを押したら冒険開始
    if (e.target.closest('#op-btn')) doAdventure();
  });

  window.startAdventure = doAdventure;
})();

/* 座標 → 地方キー 自動判定（手動ids未登録スポット用） */
function regionByCoord(lat, lon) {
  if (lat < 27.5) return 'okinawa';
  if (lat >= 41.3) return 'hokkaido';
  if (lat >= 37.0) return 'tohoku';
  // 九州本土・離島は県庁最近傍で県を判定
  if (lat <= 33.92 && lon <= 132.05 && lat > 30.2) {
    const K = [
      ['fukuoka',33.60,130.42],['saga',33.25,130.30],['nagasaki',32.75,129.87],
      ['oita',33.24,131.60],['kumamoto',32.79,130.74],['miyazaki',31.91,131.42],
      ['kagoshima',31.56,130.56]];
    let best='kumamoto', bd=1e9;
    for (const [k,la,lo] of K) {
      const d=(lat-la)*(lat-la)+(lon-lo)*(lon-lo);
      if (d<bd){ bd=d; best=k; }
    }
    return best;
  }
  if (lon >= 138.4 && lat >= 34.85) return 'kanto';
  if (lon >= 135.0 && lon < 136.45 && lat < 35.85) return 'kinki';
  if (lon >= 136.0) return 'chubu';
  if (lat < 34.3 && lon >= 132.0 && lon < 134.9) return 'shikoku';
  return 'chugoku';
}

/* spot_id → エリア ルックアップ（手動ids優先・未登録は座標で自動分類） */
const SPOT_AREA = {};
Object.entries(AREAS).forEach(([aKey, a]) => {
  a.ids.forEach(id => { SPOT_AREA[id] = aKey; });
});
Object.entries(SPOTS).forEach(([id, s]) => {
  if (!SPOT_AREA[id] && s && typeof s.lat === 'number') {
    SPOT_AREA[id] = regionByCoord(s.lat, s.lon);
  }
});
function getArea(id) {
  const key = SPOT_AREA[id] || 'kumamoto';
  return { key, ...AREAS[key] };
}

function getSpotType(id, name) {
  if (/castle/.test(id))               return 'castle';
  if (/shrine/.test(id))               return 'shrine';
  if (/temple|ji$|dera$/.test(id))     return 'temple';
  if (/tomb|grave|mausoleum/.test(id)) return 'tomb';
  if (/battle|battlefield/.test(id))   return 'battle';
  if (/museum/.test(id))               return 'museum';
  if (/park/.test(id))                 return 'park';
  if (/garden/.test(id))               return 'garden';
  if (/memorial|monument/.test(id))    return 'monument';
  if (/城跡|城址|城/.test(name))        return 'castle';
  if (/神社|大社|天満宮|八幡宮|稲荷/.test(name)) return 'shrine';
  if (/寺|院$|庵$|堂$/.test(name))     return 'temple';
  if (/古墳|陵|御陵|塚|墓|廟/.test(name)) return 'tomb';
  if (/古戦場|戦跡|合戦/.test(name))   return 'battle';
  if (/博物館|資料館|記念館/.test(name)) return 'museum';
  if (/公園/.test(name))               return 'park';
  if (/庭園|苑/.test(name))            return 'garden';
  if (/屋敷|邸/.test(name))            return 'house';
  if (/港|湊/.test(name))              return 'port';
  if (/石碑|碑|跡$/.test(name))        return 'monument';
  return 'other';
}
function getSpotEmoji(id, name) { return TYPE_META[getSpotType(id, name)].emoji; }
function getTypeColor(id, name) { return TYPE_META[getSpotType(id, name)].color; }

/* ── ドット絵ピクセルマーカーHTML生成（divIcon用） ── */
function makeMarkerHTML(color, emoji, size=28, visited=false) {
  // 四角枠なし：絵文字を大きく＋白フチで地図に埋もれず視認しやすく
  const fs     = Math.round(size * 1.05);
  const alpha  = visited ? '0.5' : '1';
  const filter = (visited ? 'grayscale(1) ' : '') +
    'drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff) drop-shadow(0 1px 1px rgba(0,0,0,0.55))';
  return `<div style="
    width:${size}px;height:${size}px;
    display:flex;align-items:center;justify-content:center;
    font-size:${fs}px;line-height:1;
    opacity:${alpha};
    filter:${filter};
    position:relative;

    if (!on) return;
    boot();
    if (ctx.state === 'suspended') ctx.resume();
    stopAll(); tid = id;
    const run = () => {
      if (tid !== id) return;
      mel.forEach(([f,t,d,tp,v]) => playN(f, t, d, tp||'square', v||0.5));
      if (harm) harm.forEach(([f,t,d,tp,v]) => playN(f, t, d, tp||'square', v||0.28));
      if (bass) bass.forEach(([f,t,d,tp,v]) => playN(f, t, d, tp||'triangle', v||0.28));
      if (loop) timer = setTimeout(run, (loopLen||L) * 1000 - 60);
    };
    run();
  };

  let userTrack = localStorage.getItem('bgm_track') || 'town';
  let override = null;
  const currentTrack = () => override || userTrack;
  const playField = () => {
    const t = currentTrack();
    if (t === 'journey') play(FIELD_JOURNEY, FIELD_JOURNEY_BASS, true, 'field', FIELD_JOURNEY_HARM, L);
    else play(FIELD_TOWN, FIELD_TOWN_BASS, true, 'field', FIELD_TOWN_HARM, TL);
  };
  return {
    title:  ()  => play(FANFARE, FANFARE_BASS, false, 'title', FANFARE_HARM),
    field:  (ms=1200) => setTimeout(playField, ms),
    stop:   stopAll,
    toggle() {
      on = !on;
      localStorage.setItem('bgm', on ? '1' : '0');
      if (!on) { stopAll(); return false; }
      playField();
      return true;
    },
    setTrack(t) {
      userTrack = t;
      localStorage.setItem('bgm_track', t);
      if (!override && on && tid === 'field') playField();
    },
    setOverride(t) {
      if (override === t) return;
      override = t;
      if (on && tid === 'field') playField();
    },
    clearOverride() {
      if (!override) return;
      override = null;
      if (on && tid === 'field') playField();
    },
    getTrack: () => userTrack,
    isOn: () => on,
  };
})();

/* ── 訪問済み管理 ── */
const VISITED_KEY = 'visited_spots_v1';
function getVisited() { try { return new Set(JSON.parse(localStorage.getItem(VISITED_KEY)||'[]')); } catch(e){ return new Set(); } }
function saveVisited(s) { localStorage.setItem(VISITED_KEY, JSON.stringify([...s])); }
let visitedSet = getVisited();

function markVisited(id) {
  visitedSet.add(id);
  saveVisited(visitedSet);
  refreshMarker(id);
  playPikon();
  updateProgress();
  const btn = document.getElementById('visited-btn-'+id);
  if (btn) { btn.textContent = '✓ 訪問済み'; btn.style.background='#444455'; btn.style.color='#88AAFF'; }
}

function refreshMarker(id) {
  const spot = SPOTS[id];
  if (!spot || !markers[id]) return;
  const type = getSpotType(id, spot.name||'');
  const meta = TYPE_META[type];
  const size = SPOT_SIZES[id] || 20;
  const visited = visitedSet.has(id);
  markers[id].marker.setIcon(L.divIcon({
    className: '', html: makeMarkerHTML(meta.color, meta.emoji, size, visited),
    iconSize:[size,size], iconAnchor:[size/2,size/2], popupAnchor:[0,-size/2-4]
  }));
}

/* ── DQピコン音 ── */
function playPikon() {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [[880,0,0.08],[1320,0.08,0.08],[1760,0.16,0.12]].forEach(([freq,start,dur])=>{
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type='square'; o.frequency.value=freq;
      g.gain.setValueAtTime(0.15, ctx.currentTime+start);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+start+dur);
      o.start(ctx.currentTime+start); o.stop(ctx.currentTime+start+dur+0.01);
    });
  } catch(e){}
}

Object.entries(SPOTS).forEach(([id, spot]) => {
  const area = getArea(id);
  const type = getSpotType(id, spot.name||'');
  const meta = TYPE_META[type];
  const size = SPOT_SIZES[id] || 20;
  const visited = visitedSet.has(id);
  const icon = L.divIcon({
    className: '', html: makeMarkerHTML(meta.color, meta.emoji, size, visited),
    iconSize:[size,size], iconAnchor:[size/2,size/2], popupAnchor:[0,-size/2-4]
  });
  const marker = L.marker([spot.lat, spot.lon], { icon }).addTo(map);
  const isVisited = visitedSet.has(id);
  marker.bindPopup(`
    <div class="popup-name">${meta.emoji} ${spot.name}</div>
    <div class="popup-era">${spot.era}</div>
    <div class="popup-highlight">${spot.highlight}</div>
    <a class="popup-btn" href="/spot/${id}">▶ 音声解説を聞く</a>
    <button class="popup-btn" id="visited-btn-${id}" onclick="markVisited('${id}')" style="margin-top:6px;background:${isVisited?'#444455':'#1a1a5e'};color:${isVisited?'#88AAFF':'#AAAAFF'};border-color:${isVisited?'#6666AA':'rgba(255,255,255,0.4)'}">
      ${isVisited?'✓ 訪問済み':'＋ 訪問済みにする'}
    </button>
  `, { maxWidth: 260 });
  marker.on('click', () => playPikon());
  marker.on('popupopen', () => BGM.setOverride('town'));
  marker.on('popupclose', () => BGM.clearOverride());
  markers[id] = { marker, areaKey: area.key, type };
});

/* ── 都道府県で絞り込み ── */
function filterPref(pref) {
  // ボタンのアクティブ状態
  document.querySelectorAll('#pref-bar .drill-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  event.target.style.background = '#5c9cf5';
  event.target.style.color = '#000030';

  currentBounds = { sw: pref.sw, ne: pref.ne };
  map.setView(pref.center, pref.zoom, { animate: true });
  applyFilters();
  buildList(currentArea);

  // 市町村クラスター表示
  const clusters = getClusters(pref);
  showCityBar(clusters);
  setMapTop(209);
  playPikon();
}

/* ── スポットを0.3°グリッドでクラスタリング ── */
function getClusters(pref) {
  const inPref = Object.entries(SPOTS).filter(([id, s]) =>
    s.lat >= pref.sw[0] && s.lat <= pref.ne[0] &&
    s.lon >= pref.sw[1] && s.lon <= pref.ne[1]
  );
  if (inPref.length === 0) return [];

  const grid = {};
  inPref.forEach(([id, s]) => {
    const gk = `${Math.round(s.lat / 0.25) * 0.25}_${Math.round(s.lon / 0.25) * 0.25}`;
    if (!grid[gk]) grid[gk] = { spots: [], latSum: 0, lonSum: 0 };
    grid[gk].spots.push([id, s]);
    grid[gk].latSum += s.lat;
    grid[gk].lonSum += s.lon;
  });

  return Object.values(grid).map(g => {
    const n = g.spots.length;
    const top = [...g.spots].sort((a, b) => (b[1].figures||[]).length - (a[1].figures||[]).length)[0];
    const label = top[1].name.length > 6 ? top[1].name.slice(0, 6) + '…' : top[1].name;
    return { lat: g.latSum / n, lon: g.lonSum / n, count: n, label, bounds: g.spots };
  }).sort((a, b) => b.count - a.count);
}

/* ── 市町村エリアバー表示 ── */
function showCityBar(clusters) {
  const bar = document.getElementById('city-bar');
  bar.innerHTML = '';
  if (clusters.length === 0) { bar.classList.remove('show'); return; }

  const all = document.createElement('button');
  all.className = 'drill-btn active';
  all.style.cssText = 'background:#5c9cf5;color:#000030;border-color:transparent';
  all.textContent = '🗺️ 全域';
  all.onclick = () => {
    currentBounds = null; // ← pref bounds に戻す（filterPref内で保持）
    document.querySelectorAll('#city-bar .drill-btn').forEach(b => { b.style.background=''; b.style.color=''; b.classList.remove('active'); });
    all.classList.add('active');
    all.style.cssText = 'background:#5c9cf5;color:#000030;border-color:transparent';
    // 県レベルに戻す
    const activePref = document.querySelector('#pref-bar .drill-btn.active');
    if (activePref) activePref.click();
  };
  bar.appendChild(all);

  clusters.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'drill-btn';
    btn.textContent = `${c.label}（${c.count}）`;
    btn.onclick = () => {
      document.querySelectorAll('#city-bar .drill-btn').forEach(b => { b.style.background=''; b.style.color=''; b.classList.remove('active'); });
      btn.classList.add('active');
      btn.style.cssText = 'background:#FFD700;color:#000030;border-color:transparent';
      currentBounds = {
        sw: [c.lat - 0.15, c.lon - 0.15],
        ne: [c.lat + 0.15, c.lon + 0.15]
      };
      map.setView([c.lat, c.lon], 13, { animate: true });
      applyFilters();
      buildList(currentArea);
      playPikon();
    };
    bar.appendChild(btn);
  });

  bar.classList.add('show');
}

function hideCityBar() {
  document.getElementById('city-bar').classList.remove('show');
}

/* ── 種別フィルター ── */
let currentType = 'all';
function filterType(type, btn) {
  currentType = type;
  document.querySelectorAll('.type-btn').forEach(b => {
    b.classList.remove('active');
    b.style.background = ''; b.style.borderColor = ''; b.style.color = '';
  });
  btn.classList.add('active');
  const color = type === 'all' ? '#5c9cf5' : (TYPE_META[type]?.color || '#5c9cf5');
  btn.style.background = color; btn.style.borderColor = color; btn.style.color = '#000030';
  applyFilters();
}

/* ── エリアフィルター ── */
let currentArea = 'all';
function filterArea(areaKey) {
  currentArea = areaKey;
  currentBounds = null;
  document.querySelectorAll('.area-btn').forEach(b => {
    const isActive = b.dataset.area === areaKey;
    b.classList.toggle('active', isActive);
    if (isActive) {
      const color = areaKey === 'all' ? '#5c9cf5' : AREAS[areaKey]?.color || '#5c9cf5';
      b.style.background = color; b.style.borderColor = color; b.style.color = '#000030';
    } else { b.style.background = ''; b.style.borderColor = ''; b.style.color = ''; }
  });

  if (areaKey !== 'all' && BROAD_REGIONS.has(areaKey) && PREF_DATA[areaKey]) {
    showPrefBar(areaKey);
  } else {
    hidePrefBar();
  }
  applyFilters();
}

function applyFilters() {
  const bounds = [];
  Object.entries(markers).forEach(([id, { marker, areaKey: mk, type }]) => {
    const spot = SPOTS[id];
    let areaOk;
    if (currentBounds) {
      areaOk = spot.lat >= currentBounds.sw[0] && spot.lat <= currentBounds.ne[0] &&
               spot.lon >= currentBounds.sw[1] && spot.lon <= currentBounds.ne[1];
    } else {
      areaOk = currentArea === 'all' || mk === currentArea;
    }
    const typeOk = currentType === 'all' || type === currentType;
    if (areaOk && typeOk) { marker.addTo(map); bounds.push([spot.lat, spot.lon]); }
    else                  { marker.remove(); }
  });
  if (!currentBounds) {
    if (bounds.length > 0 && currentArea !== 'all') {
      map.fitBounds(bounds, { padding:[50,50], maxZoom:12 });
    } else if (currentArea === 'all' && currentType === 'all') {
      map.setView([36.5,136.5], 5);
    } else if (bounds.length > 0) {
      map.fitBounds(bounds, { padding:[50,50], maxZoom:12 });
    }
  }
  buildList(currentArea);
}

/* 初期ボタンスタイル */
const allBtn = document.querySelector('[data-area="all"]');
allBtn.style.background = '#5c9cf5'; allBtn.style.borderColor = '#5c9cf5'; allBtn.style.color = '#000030';
const allTypeBtn = document.querySelector('[data-type="all"]');
allTypeBtn.style.background = '#5c9cf5'; allTypeBtn.style.borderColor = '#5c9cf5'; allTypeBtn.style.color = '#000030';

/* ── 距離計算（km） ── */
let userLat = null, userLon = null;
function haversine(lat1,lon1,lat2,lon2) {
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* ── リスト生成 ── */
function buildList(areaKey) {
  const container = document.getElementById('list-content');
  container.innerHTML = '';
  let filtered = Object.entries(SPOTS).filter(([id,spot]) => {
    const areaOk = areaKey === 'all' || SPOT_AREA[id] === areaKey;
    const typeOk  = currentType === 'all' || getSpotType(id, spot.name||'') === currentType;
    return areaOk && typeOk;
  });

  // GPS取得済みなら距離順、そうでなければエリアグループ
  if (userLat !== null) {
    filtered.sort(([,a],[,b]) => haversine(userLat,userLon,a.lat,a.lon) - haversine(userLat,userLon,b.lat,b.lon));
    const nearLabel = document.createElement('div');
    nearLabel.className = 'list-area-header';
    nearLabel.style.color = '#FFD700';
    nearLabel.textContent = `📍 近い順（${filtered.length}件）`;
    container.appendChild(nearLabel);
    filtered.forEach(([id,spot]) => appendSpotCard(container, id, spot));
  } else {
    // 県単位でグループ化（地方→県の順に並べる）
    const grouped = {};
    filtered.forEach(([id,spot]) => {
      const p = prefOf(id, spot);
      if (!grouped[p.key]) grouped[p.key] = { info:p, spots:[] };
      grouped[p.key].spots.push([id,spot]);
    });
    const keys = Object.keys(grouped).sort((a,b) =>
      grouped[a].info.rank - grouped[b].info.rank);
    keys.forEach(k => {
      const g = grouped[k];
      const header = document.createElement('div');
      header.className = 'list-area-header';
      header.style.color = g.info.color;
      header.textContent = `${g.info.emoji} ${g.info.name}（${g.spots.length}）`;
      container.appendChild(header);
      g.spots.forEach(([id,spot]) => appendSpotCard(container, id, spot));
    });
  }
}

/* スポットの所属県を判定（広域地方は県境界矩形で細分、九州は地区/県のまま） */
const REGION_ORDER = ['hokkaido','tohoku','kanto','chubu','kinki','chugoku','shikoku',
  'fukuoka','saga','nagasaki','oita','kumamoto','tabaruzaka','kikuchi','tamana',
  'yatsushiro','aso','hitoyoshi','kamimashiki','oguni','miyazaki','kagoshima','okinawa'];
function prefOf(id, spot) {
  const aKey = SPOT_AREA[id] || 'kumamoto';
  let ri = REGION_ORDER.indexOf(aKey); if (ri < 0) ri = 90;
  if (PREF_DATA[aKey]) {
    const list = PREF_DATA[aKey];
    const col = AREAS[aKey]?.color || '#5c9cf5';
    // 1) 県境界矩形内
    for (let i = 0; i < list.length; i++) {
      const p = list[i];
      if (spot.lat >= p.sw[0] && spot.lat <= p.ne[0] &&
          spot.lon >= p.sw[1] && spot.lon <= p.ne[1]) {
        return { key:p.key, name:p.name, emoji:p.emoji, color:col, rank:ri*100+i };
      }
    }
    // 2) 矩形外 → 最寄りの県中心にスナップ
    let bi = 0, bd = Infinity;
    for (let i = 0; i < list.length; i++) {
      const c = list[i].center;
      const d = (spot.lat-c[0])*(spot.lat-c[0]) + (spot.lon-c[1])*(spot.lon-c[1]);
      if (d < bd) { bd = d; bi = i; }
    }
    const p = list[bi];
    return { key:p.key, name:p.name, emoji:p.emoji, color:col, rank:ri*100+bi };
  }
  const a = AREAS[aKey] || AREAS.kumamoto;
  return { key:aKey, name:a.name, emoji:a.emoji, color:a.color, rank:ri*100 };
}

function appendSpotCard(container, id, spot) {
  const type = getSpotType(id, spot.name||'');
  const meta = TYPE_META[type];
  const visited = visitedSet.has(id);
  const dist = userLat !== null ? ` · ${haversine(userLat,userLon,spot.lat,spot.lon).toFixed(1)}km` : '';
  const card = document.createElement('a');
  card.href = `/spot/${id}`;
  card.className = 'spot-card';
  if (visited) card.style.opacity = '0.5';
  card.innerHTML = `
    <div class="spot-icon-box" style="background:${meta.color}33;border-color:${meta.color}66">${meta.emoji}</div>
    <div class="spot-info">
      <div class="spot-name">${visited?'✓ ':''}${spot.name}</div>
      <div class="spot-kana">${spot.kana||''}${dist}</div>
      <div class="spot-era">${spot.era}</div>
    </div>
    <div class="arrow">▶</div>`;
  container.appendChild(card);
}
buildList('all');
updateProgress();

/* ── タブ切り替え ── */
function switchTab(tab) {
  document.getElementById('tab-map').classList.toggle('active', tab === 'map');
  document.getElementById('tab-list').classList.toggle('active', tab === 'list');
  document.getElementById('tab-search').classList.toggle('active', tab === 'search');
  document.getElementById('list-view').classList.toggle('show', tab === 'list');
  document.getElementById('search-view').classList.toggle('show', tab === 'search');
  if (tab === 'map') map.invalidateSize();
  if (tab === 'search') setTimeout(() => document.getElementById('search-input').focus(), 100);
}

/* ── 検索 ── */
const FIGURES_DATA = {{ figures | tojson }};

function doSearch(query) {
  const results = document.getElementById('search-results');
  const hint    = document.getElementById('search-hint');
  query = query.trim();
  if (!query) {
    results.innerHTML = '';
    results.appendChild(hint);
    hint.style.display = '';
    return;
  }
  hint.style.display = 'none';
  const q = query.toLowerCase();

  // 人物名マッチ → その人物のスポットIDセット
  const figMatchIds = new Set();
  Object.entries(FIGURES_DATA).forEach(([fid, fig]) => {
    if ((fig.name||'').includes(q) || (fig.kana||'').includes(q) || (fig.desc||'').includes(q)) {
      Object.entries(SPOTS).forEach(([sid, s]) => {
        if ((s.figures||[]).includes(fid)) figMatchIds.add(sid);
      });
    }
  });

  const matched = Object.entries(SPOTS).filter(([id, s]) => {
    return (s.name||'').includes(q)
        || (s.kana||'').includes(q)
        || (s.era||'').includes(q)
        || (s.highlight||'').includes(q)
        || figMatchIds.has(id);
  });

  results.innerHTML = '';
  if (!matched.length) {
    results.innerHTML = `<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);font-size:12px;">「${query}」に一致する史跡が見つかりません</div>`;
    return;
  }
  const label = document.createElement('div');
  label.className = 'list-area-header';
  label.style.color = '#FFD700';
  label.textContent = `🔍 「${query}」— ${matched.length}件`;
  results.appendChild(label);
  matched.forEach(([id, spot]) => appendSpotCard(results, id, spot));
}

/* ── 訪問進捗 ── */
function updateProgress() {
  const total   = Object.keys(SPOTS).length;
  const visited = visitedSet.size;
  const pct     = Math.floor(visited / total * 100);
  document.getElementById('progress-badge').textContent =
    visited > 0
      ? `🏆 ${visited} / ${total} 件訪問済み（${pct}%）`
      : '▶ 史跡をタップして音声解説';
}

/* ── GPS ── */
let userMarker = null;
function setGPS(lat, lon, label) {
  userLat = lat; userLon = lon;
  document.getElementById('gpsDot').className = 'gps-dot active';
  document.getElementById('gpsLabel').textContent = label;
  buildList(currentArea);
  if (userMarker) map.removeLayer(userMarker);
  const playerIcon = L.divIcon({
    className: '',
    html: '<div class="player-icon">🧙</div>',
    iconSize: [28, 28],
    iconAnchor: [14, 14]
  });
  userMarker = L.marker([lat, lon], { icon: playerIcon }).addTo(map).bindPopup('▶ 現在地');
}
function zoomToMe() {
  if (userLat !== null) {
    map.setView([userLat, userLon], 13, { animate: true });
    playPikon();
  } else {
    document.getElementById('gpsLabel').textContent = '取得中';
    retryGPS();
  }
}

function retryGPS() {
  document.getElementById('gpsDot').className = 'gps-dot';
  document.getElementById('gpsLabel').textContent = '取得中';
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      p => setGPS(p.coords.latitude, p.coords.longitude, 'GPS'),
      () => tryIPLocation(),
      { enableHighAccuracy: true, timeout: 20000 }
    );
  } else { tryIPLocation(); }
}
function tryIPLocation() {
  fetch('https://ipapi.co/json/').then(r=>r.json()).then(d=>{
    if (d.latitude) setGPS(d.latitude, d.longitude, '概算');
    else { document.getElementById('gpsDot').className='gps-dot error'; document.getElementById('gpsLabel').textContent='失敗'; }
  }).catch(()=>{ document.getElementById('gpsDot').className='gps-dot error'; });
}
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    p => setGPS(p.coords.latitude, p.coords.longitude, 'GPS'),
    () => tryIPLocation(),
    { enableHighAccuracy: true, timeout: 20000 }
  );
  navigator.geolocation.watchPosition(
    p => setGPS(p.coords.latitude, p.coords.longitude, 'GPS'),
    ()=>{}, { enableHighAccuracy: true, maximumAge: 15000 }
  );
} else { tryIPLocation(); }
